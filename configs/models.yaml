default_backend: openai
backends:
  mock:
    model_name: mock-v1
    temperature: 0.0
    max_tokens: 512
  openai:
    model_name: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 512
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
  deepseek-v4-pro:
    model_name: deepseek-v4-pro
    temperature: 0.0
    max_tokens: 512
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    base_url: https://api.deepseek.com
    extra_body:
      thinking:
        type: disabled
  deepseek-v4-flash:
    model_name: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 512
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    base_url: https://api.deepseek.com
    extra_body:
      thinking:
        type: disabled
  llamafactory_openai_compat:
    model_name: local-tool-model
    temperature: 0.0
    max_tokens: 512
    api_key_env: OPENAI_API_KEY
    base_url: http://127.0.0.1:8000/v1
