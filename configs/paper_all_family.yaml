benchmark_version: v3

experiment:
  name: "paper_all_family_base"
  description: "Base config for paper all-family runs. The one-click script runs one model and one family per output directory."

models:
  include:
    - gpt-5.4
    - gpt-5.4-mini
    - claude-sonnet-4-6
    - claude-haiku-4-5
    - gemini-2.5-pro
    - gemini-2.5-flash
    - deepseek-v4-flash
    - DeepSeek-R1-0528
    - mistral-large-latest
    - kimi-k2.6
    - qwen-plus

dataset:
  source: local_tools
  task_scope: single_step
  max_clean_per_tool: 3
  sample_tool_count: 16
  seed: 20260511

noise:
  enabled_families:
    - interface_exposure
    - user_intent
    - observation
    - execution_environment
  enabled_subtypes: all
  disabled_operators: []
  severities:
    - clean
    - light
    - medium
    - heavy
  severity_policy: standard
  allow_cross_family_heavy: false
  max_operators_per_sample: 3
  samples_per_bucket: 1

cross_family:
  enabled: false
  strategy: pairwise
  family_sets: []
  severities:
    - medium
    - heavy
  samples_per_combo_bucket: 1
  max_families_per_sample: 2
  include_single_family_baseline: true

execution:
  timeout_sec: 120
  retry_times: 2

output:
  profile: lite
  clean_output: true
  generate_plots: true
  keep_missing_buckets: true
  severity_order:
    - clean
    - light
    - medium
    - heavy
