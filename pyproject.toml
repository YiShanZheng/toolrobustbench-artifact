[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolrobust"
version = "0.1.0"
description = "Benchmark framework for stage-wise robustness evaluation of tool-calling agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anonymous Authors" }]
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "openai>=1.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
toolrobust = "toolrobust.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
